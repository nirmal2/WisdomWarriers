services:
  - type: web
    name: insta-analytics-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && cd .. && python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APIFY_POSTS_ACTOR_ID
        value: xMc5Ga1oCONPmWJIa
      - key: APIFY_PROFILES_ACTOR_ID
        value: dSCLg0C3YEZ83HzYX
      - key: PROFILE_SCRAPE_PARALLELISM
        value: "6"

  - type: web
    name: insta-analytics-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://insta-analytics-backend.onrender.com
